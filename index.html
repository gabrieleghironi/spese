<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1E33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spese">
<title>Spese Gabriele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1E33; --bg2:#13253D; --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.06);
  --line:#28405F; --ink:#EDEEE8; --soft:#8FA3BF; --pos:#5FC9A8; --neg:#E4776E; --gold:#D9A94E;
  --serif:'Fraunces',Georgia,serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace; --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{margin:0;padding:14px 12px 80px}
.gtop{grid-template-columns:2fr 1fr;align-items:stretch}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.cc-card{display:flex;flex-direction:column;justify-content:center}
.cc-card .bignum{font-size:46px}
.proj-sec{min-width:0}
.proj-sec h4{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:500}
.per{display:flex;gap:4px}
.per select{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 2px;font-size:12px;color:var(--soft)}
.per select:hover{border-color:var(--line)}
form.add select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 6px}
tr.off td{opacity:.55}
@media (max-width:1250px){.gtop,.g3{grid-template-columns:1fr}}
/* header */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:.2px}
.brand small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:2px}
.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:210px}
.btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#0F1E33;font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger:hover{border-color:var(--neg);color:var(--neg)}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--soft);padding:2px 6px;border-radius:6px}
.iconbtn:hover{color:var(--neg);background:var(--card2)}
.status{font-family:var(--mono);font-size:11px;color:var(--soft)}
details.menu{position:relative}
details.menu summary{list-style:none;cursor:pointer}
details.menu summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:230px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;color:var(--soft);font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
/* cards */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:5fr 7fr;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1250px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (max-width:700px){.g4{grid-template-columns:1fr}}
@media (max-width:640px){
  body{font-size:15px}
  .wrap{padding:10px 8px 70px}
  .brand{font-size:21px}
  .nav{width:100%}.nav select{min-width:0;flex:1 1 auto}
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}.tab{white-space:nowrap;padding:9px 11px}
  .card{padding:12px 10px;overflow-x:auto}
  .bignum{font-size:28px}.cc-card .bignum{font-size:36px}.hero{padding:16px}.hero .bignum{font-size:40px!important}
  form.add .grow,form.add select,form.add .amt,form.add .dt{flex:1 1 100%;width:100%;max-width:none!important}
  form.add input,form.add select{padding:10px;font-size:16px}
  form.add .btn{flex:1 1 100%;padding:10px}
  tr.det .row{flex-wrap:wrap!important}tr.det .row>*{flex:1 1 45%;width:auto!important}
  .lever{grid-template-columns:1fr 76px;gap:6px 10px}.lever input[type=range]{grid-column:1/-1;grid-row:2}
  details.menu .pop{right:auto;left:0}
  .g2>.stack:last-child{order:-1}
  .fab{display:block!important}
}
.fab{display:none;position:fixed;right:14px;bottom:18px;z-index:30;background:var(--gold);color:#0F1E33;border:0;border-radius:28px;padding:13px 20px;font-weight:600;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .tot{font-size:13px;color:var(--ink);letter-spacing:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.soft{color:var(--soft)}.gold{color:var(--gold)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv.big{border-bottom:0;padding-top:10px}
.kv .l{color:var(--soft)}
.kv.sub{padding-left:12px;font-size:12.5px}
.bignum{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
.hint{font-size:11.5px;color:var(--soft)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
/* tables */
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:500;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th.l,td.l{text-align:left}
td{padding:3px 4px;border-bottom:1px solid rgba(40,64,95,.55);vertical-align:middle}
td.r{text-align:right}
tr.grp td{background:rgba(255,255,255,.025)}
tr.det td{background:rgba(0,0,0,.18);font-size:12.5px}
tr.tot td{font-weight:600;border-bottom:0;padding-top:8px}
.cell{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;min-width:0}
.cell:hover{border-color:var(--line)}
.cell:focus{outline:none;border-color:var(--gold);background:var(--bg2)}
.cell.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.cell.bad{border-color:var(--neg)!important}
input[type=date].cell{font-family:var(--mono);font-size:12px;padding:3px 4px}
.chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--soft);background:transparent;cursor:pointer;color:var(--pos);font-size:13px;line-height:1;padding:0;display:inline-flex;align-items:center;justify-content:center}
.chk.on{border-color:var(--pos);background:rgba(95,201,168,.15)}
.chk.mix{border-color:var(--gold);color:var(--gold)}
.chk[disabled]{opacity:.35;cursor:default}
.tag{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--soft);white-space:nowrap}
.tag.on{border-color:var(--gold);color:var(--gold)}
.once{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:10px;padding:1px 6px;background:none;color:var(--soft);cursor:pointer}
.once.on{border-color:var(--gold);color:var(--gold);background:rgba(217,169,78,.12)}
form.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
form.add input{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
form.add input:focus{outline:none;border-color:var(--gold)}
form.add .grow{flex:1 1 140px}
form.add .amt{width:110px;text-align:right;font-family:var(--mono)}
form.add .dt{width:128px;font-family:var(--mono);font-size:12px}
.caret{background:none;border:0;cursor:pointer;color:var(--soft);padding:0 4px;font-size:11px}
/* range */
.lever{display:grid;grid-template-columns:minmax(140px,220px) 1fr 86px;gap:14px;align-items:center;padding:7px 0}
.lever .nm small{display:block;color:var(--soft);font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(to right,var(--gold) var(--p),var(--line) var(--p));outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid var(--gold)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid var(--gold)}
.pill{font-family:var(--mono);font-size:12px;padding:7px 12px;border-radius:20px;border:1px solid var(--line);background:transparent;color:var(--soft);cursor:pointer}
.pill:hover{border-color:var(--gold);color:var(--ink)}
.pill.on{background:var(--gold);border-color:var(--gold);color:#0F1E33;font-weight:600}
.chip{font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--pos);background:rgba(95,201,168,.1);cursor:pointer}
.chip.off{border-color:var(--neg);background:rgba(228,119,110,.08);color:var(--soft);text-decoration:line-through}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-end;padding:22px 24px}
.sectitle{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
textarea.cell{border-color:var(--line);min-height:70px;resize:vertical;font-family:var(--mono);font-size:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--soft)}
label.f input,label.f select{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink)}
/* dialog + toast */
dialog{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:560px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(5,12,22,.65)}
dialog h2{margin:0 0 12px;font-family:var(--serif);font-weight:500;font-size:22px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.carry{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-top:6px}
.carry label{display:flex;gap:8px;align-items:center;padding:3px 0}
#ptr{position:fixed;left:50%;top:env(safe-area-inset-top,0px);z-index:60;transform:translate(-50%,-60px);background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;color:var(--soft);box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;opacity:0;white-space:nowrap}
#ptr.go{color:var(--gold);border-color:var(--gold)}
#ptr.anim{transition:transform .25s ease,opacity .25s ease}
html,body{overscroll-behavior-y:none}
#sbar{position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:55}
.wrap{padding-top:calc(14px + env(safe-area-inset-top,0px))}
@media (max-width:640px){
  .wrap{padding-top:calc(10px + env(safe-area-inset-top,0px))}
  table{font-size:13px}
  th{font-size:9.5px;letter-spacing:.04em;padding:4px 3px}
  td{padding:5px 3px}
  td.mono,td .mono{font-size:12.5px}
  .mt,.mt tbody{display:block;width:100%}
  .mt thead{display:none}
  .mt tr{display:grid;grid-template-columns:30px repeat(4,minmax(0,1fr));gap:6px;align-items:end;padding:10px 0;border-bottom:1px solid rgba(40,64,95,.55)}
  .mt td{display:block;width:auto!important;border:0;padding:0;min-width:0;text-align:left}
  .mt td.empty{grid-column:1/-1}
  .mt td:first-child{grid-column:1;grid-row:1;align-self:center}
  .mt .cell{font-size:16px;border-color:var(--line);background:rgba(255,255,255,.03);padding:5px 6px}
  .mt input[type=date].cell{font-size:14px;padding:5px 4px}
  .mt .per{flex-wrap:wrap}.mt .per select{width:100%;border-color:var(--line);font-size:14px;padding:5px 2px}
  .mt td[data-l]::before,.mt-fix td:nth-child(3)::before,.mt-fix td:nth-child(4)::before,.mt-fix td:nth-child(5)::before,.mt-fix td:nth-child(6)::before,
  .mt-ent td:nth-child(3)::before,.mt-ent td:nth-child(4)::before,.mt-spe tr.grp td:nth-child(3)::before,.mt-spe tr.grp td:nth-child(4)::before,.mt-spe tr.grp td:nth-child(5)::before,.mt-spe tr.det td:nth-child(3)::before{
    display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin-bottom:3px;text-align:left}
  .mt-fix td:nth-child(2){grid-column:2/5;grid-row:1}
  .mt-fix td:nth-child(7){grid-column:5;grid-row:1;justify-self:end;align-self:center}
  .mt-fix td:nth-child(3){grid-column:2;grid-row:2}.mt-fix td:nth-child(3)::before{content:'Periodo'}
  .mt-fix td:nth-child(4){grid-column:3;grid-row:2}.mt-fix td:nth-child(4)::before{content:'Budget'}
  .mt-fix td:nth-child(5){grid-column:4;grid-row:2}.mt-fix td:nth-child(5)::before{content:'Reale'}
  .mt-fix td:nth-child(6){grid-column:5;grid-row:2;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;text-align:right;padding-bottom:6px}.mt-fix td:nth-child(6)::before{content:'Diff.';text-align:right}
  .mt-ent td:nth-child(2){grid-column:2/5;grid-row:1;display:flex;align-items:center;gap:6px}.mt-ent td:nth-child(2) .cell{flex:1 1 auto}
  .mt-ent td:nth-child(6){grid-column:5;grid-row:1;justify-self:end;align-self:center}
  .mt-ent td:nth-child(3){grid-column:2/4;grid-row:2}.mt-ent td:nth-child(3)::before{content:'Data'}
  .mt-ent td:nth-child(4){grid-column:4;grid-row:2}.mt-ent td:nth-child(4)::before{content:'Importo'}
  .mt-ent td:nth-child(5){grid-column:5;grid-row:2;justify-self:end;padding-bottom:4px}
  .mt-spe tr.grp td:nth-child(2){grid-column:2/-1;grid-row:1}
  .mt-spe tr.grp td:nth-child(3){grid-column:2;grid-row:2}.mt-spe tr.grp td:nth-child(3)::before{content:'Budget'}
  .mt-spe tr.grp td:nth-child(4){grid-column:3/5;grid-row:2;text-align:right;padding-bottom:6px}.mt-spe tr.grp td:nth-child(4)::before{content:'Reale';text-align:right}
  .mt-spe tr.grp td:nth-child(5){grid-column:5;grid-row:2;text-align:right;padding-bottom:6px}.mt-spe tr.grp td:nth-child(5)::before{content:'Rimasti';text-align:right}
  .grid.g2{grid-template-columns:minmax(0,1fr)!important}
  .lever .mono{white-space:nowrap}
  .mt-spe tr.grp{background:rgba(255,255,255,.025)}.mt-spe tr.grp td{background:none}
  td.mono,td .mono{white-space:nowrap}
  .mt .per select{font-size:13px!important}
  .mt-spe tr.det{padding:10px 6px;background:rgba(0,0,0,.18)}.mt-spe tr.det td{background:none}
  .mt-spe tr.det td:nth-child(2){grid-column:2/-1;grid-row:1}
  .mt-spe tr.det td:nth-child(3){grid-column:2/4;grid-row:2}.mt-spe tr.det td:nth-child(3)::before{content:'Importo'}
  .mt-spe tr.det td:nth-child(4){grid-column:5;grid-row:2;justify-self:end;text-align:right}
  .mt-spe tr.det .row{gap:6px}.mt-spe tr.det .row>*{flex:1 1 45%;width:auto!important}.mt-spe tr.det .row>.once{flex:0 0 auto}
  .mt-spe tr.det select.cell{font-size:14px!important}
}
dialog.sheet{margin:auto 0 0;width:100%;max-width:none;border-radius:18px 18px 0 0;border-bottom:0;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sh-grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-form{display:flex;flex-direction:column;gap:10px}
.sh-head{margin-bottom:2px}
.sh-amt{font-family:var(--mono);font-size:34px;text-align:center;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0;width:100%;color:var(--ink)}
.sh-amt:focus{outline:none;border-color:var(--gold)}
.sh-in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;color:var(--ink);min-width:0}
.sh-in.num{text-align:right;font-family:var(--mono)}
.sh-in:focus{outline:none;border-color:var(--gold)}
.sh-lab{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--soft);min-width:0}
.sh-mon{display:none}.sh-mon.on{display:flex}
.sh-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sh-chk{display:flex;align-items:center;gap:10px;font-size:15px}.sh-chk input{width:20px;height:20px;accent-color:var(--gold)}
.sh-act{display:flex;justify-content:space-between;gap:10px;margin-top:4px}.sh-act .btn{flex:1;padding:12px;font-size:16px}
.sh-go{padding:13px;font-size:16px;margin-top:2px}
#sug{gap:6px;flex-wrap:wrap}#sug:empty{display:none}
.m-wrap{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))!important}
.m-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.m-brand{font-family:var(--serif);font-size:22px;font-weight:500}
.m-month{display:flex;align-items:center;gap:4px}
.m-ib{background:none;border:0;color:var(--ink);font-size:22px;padding:4px 8px;cursor:pointer;line-height:1}
.m-sel{position:relative;border:1px solid var(--line);border-radius:16px;padding:4px 12px;text-align:center;font-size:14px}
.m-sel span{display:flex;flex-direction:column;line-height:1.2}.m-sel small{font-family:var(--mono);font-size:10px;color:var(--soft)}
.m-sel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.m-status{font-family:var(--mono);font-size:10.5px;color:var(--soft);margin:0 0 12px}
.m-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.m-list{padding:0}
.m-lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.m-big{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.15;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.m-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-soft{color:var(--soft)}.m-sm{font-size:12.5px}
.m-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.m-2 .m-card{margin-bottom:10px}
.m-num{font-size:19px;margin-top:3px}
.m-det summary{list-style:none;cursor:pointer}.m-det summary::-webkit-details-marker{display:none}
.m-det summary>div{flex:1;min-width:0}.m-push{white-space:nowrap}
.m-chev{display:inline-block;color:var(--soft);transition:transform .15s}.m-det[open] .m-chev,.m-chev.open{transform:rotate(90deg)}
.m-detb{margin-top:10px}

const eur=(n,o)=>{o=o||{};if(n==null||isNaN(n))return '—';const v=Math.round(n*100)/100;const s=Math.abs(v).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'});return (v<0?'-':(o.plus&&v>0?'+':''))+'€'+s;};
const eur0=n=>{if(n==null||isNaN(n))return '—';const v=Math.round(n);return (v<0?'-':'')+'€'+Math.abs(v).toLocaleString('it-IT',{useGrouping:'always'});};

function evalExpr(str){
  if(str==null)return NaN;
  let s=String(str).trim().replace(/€/g,'').replace(/\s+/g,'');
  if(!s)return NaN;
  if(s.indexOf(',')>=0&&s.indexOf('.')>=0)s=s.replace(/\./g,'');
  s=s.replace(/,/g,'.');
  if(!/^[0-9+\-*/().]+$/.test(s))return NaN;
  try{const v=Function('"use strict";return ('+s+')')();return (typeof v==='number'&&isFinite(v))?v:NaN;}catch(e){return NaN;}
}
// importo digitato -> importo con segno. natural=-1 per spese, +1 per entrate. Un "+" o "-" iniziale inverte il verso naturale.
function parseAmount(str,natural){
  const t=String(str==null?'':str).trim();
  const v=evalExpr(t.replace(/^[+]/,''));
  if(isNaN(v))return NaN;
  const lead=t[0];
  let sign=natural;
  if(natural<0){ sign=(lead==='+')?1:-1; return sign*Math.abs(v); }
  sign=(lead==='-')?-1:1; return sign*Math.abs(v);
}

/* ---------- stato ---------- */
// stato vuoto finché non viene letto spese-dati.json da Dropbox

const ANNUAL_KNOWN=[{re:/amazon/i,amount:-49.9,month:12},{re:/dropbox/i,amount:-119.88,month:3}];
const CAT_DEFAULT=[

 ['Cene/Pranzi/Aperitivi/Extra','30',['Aperitivi','Aperitivo','Pizza e cene','Cena/Aperitivi'],['cena','pranzo','aperitivo','apericena','spritz','bar','caffè','colazione','gelato','gelateria','pizza','pizzeria','sushi','ristorante','trattoria','osteria','pub','birra','vino','cocktail','kebab','panino','piadina','hamburger','burger','mcdonald','pasticceria','brioche','deliveroo','glovo','just eat','asporto','take away','bistrot','poke']],

 ['Manutenzione auto','50',['Bollo Auto','Bollo auto fulvio','Cambio gomme','Tagliando'],['auto','bollo','gomme','pneumatici','gommista','tagliando','revisione','carrozziere','carrozzeria','olio','batteria','officina','meccanico']],

 ['Parcheggio','50',['Parcheggio Lucca','Parcheggio','Parcheggi'],['sosta','strisce blu','garage','easypark','mycicero','parchimetro']],

 ['Ricarica macchinette','50',['Argenta','Chiavetta lavoro','Buonristoro','Ricarica macchinette'],['macchinetta','macchinette','chiavetta','distributore automatico']],
 ['Sigarette','30',[],['tabacchi','tabaccheria','tabacco','iqos','cartine','filtri']],
 ['Spesa','50',[],['supermercato','coop','conad','esselunga','lidl','eurospin','carrefour','pam','despar','penny','aldi','alimentari','frutta','verdura','macelleria','panetteria','forno','mercato']],
 ['Spotify','30',['Spotify','Spotify extra'],['musica']],

 ['Visite mediche','50',['Visita medica','Visita 2017','Visita 2019','Visita','Visite mediche'],['visita','medico','dentista','ticket','analisi','esami','oculista','fisioterapia','ospedale','specialista','dermatologo']],
 ['Bellezza, benessere','30',['Tigotà','L’oreal'],['shampoo','crema','profumo','cosmetici','sapone','dentifricio','rasoio','sephora','douglas','acqua e sapone','massaggio','spa','estetista']],
 ['Varie','30',['Fuochi D’artificio','Biglietto lotteria + Google smartband'],['lotteria','gratta e vinci']]
].map(r=>({name:r[0],bucket:r[1],items:r[2],kw:r[3]}));
const norm=s=>String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’`´]/g,"'").replace(/\s+/g,' ').trim();
const toks=s=>s.split(/[^a-z0-9&]+/).filter(Boolean);
function catMap(st){const mp={};(st.settings.catalog||[]).forEach(c=>{[c.name].concat(c.items||[]).forEach(x=>{const n=norm(x);if(n&&!mp[n])mp[n]=c.name;});});(st.settings.catalog||[]).forEach(c=>{mp[norm(c.name)]=c.name;});return mp;}
function applyCatalog(st){
  const mp=catMap(st);
  Object.keys(st.months||{}).forEach(k=>{const m=st.months[k];
    (m.spese||[]).forEach(i=>{const mn=mp[norm(i.cat)];if(mn&&i.cat!==mn){if(!String(i.desc||'').trim()&&norm(i.cat)!==norm(mn))i.desc=i.cat;i.cat=mn;}});
    if(m.budgets){Object.keys(m.budgets).forEach(b=>{const mn=mp[norm(b)];if(mn&&mn!==b){m.budgets[mn]=(m.budgets[mn]||0)+m.budgets[b];delete m.budgets[b];}});}
  });
}
function migrate(st){
  st.settings=st.settings||{};
  if(!st.settings.catalog){
    st.settings.catalog=JSON.parse(JSON.stringify(CAT_DEFAULT));
    st.settings.simRecurring=['Cene/Pranzi/Aperitivi/Extra','E-commerce','Benzina','Spesa','Assic. Auto','Sigarette','Abbigliamento','Farmacia','Treno','carta credito'];
    st.settings.simExclude=['Vacanze/Viaggi/Gite','Spotify','Pokemon'];
    st.settings.needCats=['Coop Voce'];
  }
  if(!st.settings.needCats)st.settings.needCats=['Coop Voce'];
  if(!st.settings.v4){st.settings.v4=true;
    const ONE={'2025-11':[['i54',155],['i67',215],['i68',112.8],['i65',101.42]],'2026-01':[['i174',150],['i163',120.37],['i178',123.65]],'2026-02':[['i204',100.19],['i224',64.79]],
      '2026-05':[['i369',595],['i389',242.9],['i370',70]],'2026-06':[['i449',117.9],['i444',99.99],['i451',105.11]],'2026-07':[['i498',126.18],['i494',334.89]],'2026-09':[['i578',72.6]],'2026-10':[['i626',170]]};
    Object.keys(ONE).forEach(k=>{const mm=st.months[k];if(!mm)return;ONE[k].forEach(([id,a])=>{const it=mm.spese.find(i=>i.id===id)||mm.spese.find(i=>Math.abs(i.amount+a)<0.005);if(it)it.once=true;});});}
  if(!st.settings.v3){st.settings.v3=true;st.settings.simWindow='all';if(st.settings.recThreshold==null)st.settings.recThreshold=0.5;
    const ex=new Set(st.settings.simExclude||[]);['Vacanze/Viaggi/Gite','Pokemon'].forEach(x=>ex.add(x));st.settings.simExclude=[...ex];
    const jl=st.months['2026-07'];if(jl)jl.spese.forEach(i=>{if(i.id==='i494'||Math.abs(i.amount+334.89)<0.005)i.once=true;});}
  Object.keys(st.months||{}).forEach(k=>{const m=st.months[k];
    ['bollette','abbonamenti','debiti'].forEach(b=>(m[b]||[]).forEach(i=>{
      if(i.period)return;
      i.period='mensile';i.month=null;
      const kn=b==='abbonamenti'?ANNUAL_KNOWN.find(x=>x.re.test(i.cat)):null;
      const ex=/^-?(\d+(?:\.\d+)?)\/12$/.exec(String(i.expr||''));
      if(kn||ex){i.period='annuale';i.month=kn?kn.month:null;const a=kn?kn.amount:-Number(ex[1]);i.amount=a;i.budget=a;i.expr=null;}
    }));
  });
  applyCatalog(st);
  return st;
}
let state=migrate(EMPTY_STATE());
let ccCache=null;
function save(){ccCache=null;scheduleFileWrite();}
const S=()=>state.settings;
function cycleInfo(key){
  const D=S().cycleStartDay||27; const [y,m]=key.split('-').map(Number);
  const start=Date.UTC(y,m-2,D), end=Date.UTC(y,m-1,D-1);
  const total=Math.round((end-start)/864e5)+1; const today=localTodayMs();
  const passed=Math.min(total,Math.max(0,Math.round((today-start)/864e5)+1));
  const status=today<start?'future':(today>end?'closed':'open');
  return {start,end,total,passed,status,frac:total?passed/total:0};
}
function keyForDate(ms){const d=new Date(ms);let y=d.getUTCFullYear(),m=d.getUTCMonth()+1;if(d.getUTCDate()>=(S().cycleStartDay||27)){m++;if(m>12){m=1;y++;}}return y+'-'+String(m).padStart(2,'0');}
function addMonths(key,n){let [y,m]=key.split('-').map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return y+'-'+String(m).padStart(2,'0');}
const keys=()=>Object.keys(state.months).sort();
const label=k=>{const [y,m]=k.split('-').map(Number);return MESI[m-1]+' '+y;};
function ensureUi(){ if(!state.months[ui.key]){const ks=keys();ui.key=ks.indexOf(keyForDate(localTodayMs()))>=0?keyForDate(localTodayMs()):ks[ks.length-1];} }

/* ---------- calcoli (replicano le formule dell'Excel) ---------- */
const FIX=['bollette','abbonamenti','debiti'];
const isAnn=i=>i.period==='annuale';
const quota=i=>isAnn(i)?i.amount/12:i.amount;
const keyOf=m=>Object.keys(state.months).find(k=>state.months[k]===m);
const dueNow=(i,key)=>!isAnn(i)||(i.month!=null&&Number(key.slice(5))===Number(i.month));
const sumQ=L=>L.reduce((a,i)=>a+quota(i),0);
function attualeOf(m,key,cc){
  let a=cc;
  FIX.forEach(b=>m[b].forEach(i=>{if(i.checked&&dueNow(i,key))a+=i.amount;}));
  a+=sum(m.spese,i=>i.checked)+sum(m.entrate,i=>i.checked&&!i.salary);
  return a;
}
function ccStartOf(key){
  if(!ccCache){ccCache={};const ks=keys();let prev=null;
    ks.forEach(k=>{const m=state.months[k];const sal=sum(m.entrate,i=>i.salary);
      ccCache[k]=prev==null?(m.ccStart||0):attualeOf(state.months[prev],prev,ccCache[prev])+sal;prev=k;});}
  return ccCache[key]||0;
}
const catalog=()=>S().catalog||[];
const catOf=name=>catalog().find(c=>c.name===name);
function isNeed(cat){const c=catOf(cat);return !!c&&c.bucket==='50';}
function isNeedAbb(cat){const c=norm(cat);return (S().needCats||[]).some(n=>n&&c.startsWith(norm(n)));}
function suggest(text){
  const q=norm(text);if(q.length<2)return [];const qt=toks(q);const res=[];
  catalog().forEach(c=>{let sc=0;
    [[c.name,1]].concat((c.items||[]).map(x=>[x,1]),(c.kw||[]).map(x=>[x,.8])).forEach(([t,w])=>{const n=norm(t);if(!n)return;let v=0;
      if(n===q)v=100;else if(n.length>=3&&q.includes(n))v=60+n.length;else if(q.length>=3&&n.includes(q))v=45+q.length;
      else{const nt=toks(n);qt.forEach(a=>nt.forEach(b=>{if(a===b&&a.length>=2)v=Math.max(v,40+a.length);else if(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a)))v=Math.max(v,30);}));}
      sc=Math.max(sc,v*w);});
    if(sc>0)res.push({name:c.name,score:sc});});
  res.sort((a,b)=>b.score-a.score);
  return res.filter(r=>r.score>=res[0].score*0.6).slice(0,3);
}
function catOptions(sel){
  const g=b=>catalog().filter(c=>c.bucket===b).map(c=>c.name).sort((a,b)=>a.localeCompare(b,'it')).map(n=>`<option value="${esc(n)}" ${n===sel?'selected':''}>${esc(n)}</option>`).join('');
  return `<option value="">Categoria…</option><optgroup label="50% necessità">${g('50')}</optgroup><optgroup label="30% svago">${g('30')}</optgroup>`;
}
function unmapped(){const c={};keys().forEach(k=>state.months[k].spese.forEach(i=>{if(!catOf(i.cat))c[i.cat]=(c[i.cat]||0)+1;}));return c;}
function totals(m){
  const key=keyOf(m);
  const salary=sum(m.entrate,i=>i.salary);
  const entrateTot=sum(m.entrate);
  const boll=sumQ(m.bollette),abb=sumQ(m.abbonamenti),deb=sumQ(m.debiti),spe=sum(m.spese);
  const fissi=boll+abb+deb;
  const residuoFisso=salary+fissi;
  const residuo=residuoFisso+spe;
  const ccStart=ccStartOf(key);
  const attuale=attualeOf(m,key,ccStart);
  const extraRic=sum(m.entrate,i=>!i.salary&&!i.once);
  let need=boll+deb,want=0;
  m.abbonamenti.forEach(i=>{if(isNeedAbb(i.cat))need+=quota(i);else want+=quota(i);});
  m.spese.forEach(i=>{if(isNeed(i.cat))need+=i.amount;else want+=i.amount;});
  return {key,salary,entrateTot,entrateExtra:entrateTot-salary,extraRic,boll,abb,deb,spe,fissi,residuoFisso,residuo,ccStart,attuale,
    des:[salary*.5,salary*.3,salary*.2],eff:[-need,-want,residuo]};
}
function spesaMap(k){const o={};state.months[k].spese.forEach(i=>{if(!i.checked||i.once)return;o[i.cat]=(o[i.cat]||0)-i.amount;});return o;}
function recStats(use){ // presenza e media per categoria su un insieme di cicli
  const exc=new Set(S().simExclude||[]);const th=S().recThreshold==null?0.5:S().recThreshold;
  const n=use.length||1;const maps=use.map(spesaMap);const pres={},tot={};
  maps.forEach(o=>Object.keys(o).forEach(c=>{if(exc.has(c))return;tot[c]=(tot[c]||0)+o[c];if(o[c]>0)pres[c]=(pres[c]||0)+1;}));
  const rec=Object.keys(tot).filter(c=>(pres[c]||0)/n>=th);
  const avg={};rec.forEach(c=>avg[c]=tot[c]/n);
  const other=Object.keys(tot).filter(c=>rec.indexOf(c)<0).reduce((a,c)=>a+tot[c],0)/n;
  return {rec,avg,other,pres,n:use.length,exc};
}
function closedUse(upTo){
  let closed=keys().filter(k=>cycleInfo(k).status==='closed');if(upTo!=null)closed=closed.filter(k=>k<upTo);
  const W=S().simWindow;return (W==='all')?closed:closed.slice(-Number(W));
}
function histAvg(){const r=recStats(closedUse());return {avg:r.avg,extra:r.other,n:r.n,pres:r.pres,rec:r.rec};}
function selfError(){ // errore medio della stima su ciclo intero, ricalcolato sui cicli chiusi
  const closed=keys().filter(k=>cycleInfo(k).status==='closed');const e=[];
  closed.forEach((k,j)=>{if(j<4)return;const r=recStats(closedUse(k));
    const pred=r.rec.reduce((a,c)=>a+r.avg[c],0)+r.other;const o=spesaMap(k);
    const act=Object.keys(o).filter(c=>!r.exc.has(c)).reduce((a,c)=>a+o[c],0);e.push(pred-act);});
  if(!e.length)return null;
  return {mae:e.reduce((a,x)=>a+Math.abs(x),0)/e.length,bias:e.reduce((a,x)=>a+x,0)/e.length,n:e.length};
}
function projection(m,ci){
  if(ci.status!=='open')return null;
  const t=totals(m);const key=t.key;
  const left=ci.total-ci.passed,w=ci.passed/ci.total;
  const h=histAvg();
  const cats=h.rec.map(c=>{
    const spent=-sum(m.spese,i=>i.cat===c&&!i.once);
    const histD=h.avg[c]/ci.total,curD=ci.passed?spent/ci.passed:0;
    const rem=Math.max(0,(w*curD+(1-w)*histD)*left);
    return {cat:c,avg:h.avg[c],spent,rem,pres:h.pres[c]||0};
  }).sort((a,b)=>b.rem-a.rem);
  const otherRem=h.extra*left/ci.total;
  const speseRem=cats.reduce((a,c)=>a+c.rem,0)+otherRem;
  const due=[];FIX.forEach(b=>m[b].forEach(i=>{if(!i.checked&&dueNow(i,key))due.push({cat:i.cat,amount:i.amount,ann:isAnn(i)});}));
  const dueTot=due.reduce((a,i)=>a+i.amount,0);
  const attese=sum(m.entrate,i=>!i.checked&&!i.salary);
  const saldo=t.attuale+dueTot+attese-speseRem;
  const se=selfError();const band=se?se.mae*left/ci.total:null;
  return {left,w,cats,otherAvg:h.extra,otherRem,speseRem,due,dueTot,attese,saldo,band,se,n:h.n};
}
function esopNet(r){
  const E=state.esop;const gain=r.valShares-r.invest;const tot=r.valShares+r.valSar;
  const rate=(r.sarTax===''||r.sarTax==null)?E.taxSarDefault:r.sarTax;
  return tot-(Math.max(0,gain)*E.taxShares+Math.max(0,tot-r.valShares)*rate);
}
const esopTotNet=()=>state.esop.rows.reduce((a,r)=>a+esopNet(r),0);
function tesoretto(){
  const T=state.tesoretto;const ks=keys();const last=state.months[ks[ks.length-1]];
  const cc=totals(last).attuale;const tfr=T.tfrLordo*(1-T.tfrTax);const esop=esopTotNet();
  const items=T.items.reduce((a,i)=>a+(i.collected?0:i.amount),0);
  return {cc,tfr,esop,items,total:cc+tfr+esop+items};
}
function simBase(){
  const closed=keys().filter(k=>cycleInfo(k).status==='closed');
  const W=S().simWindow;const use=(W==='all')?closed:closed.slice(-Number(W));
  const n=use.length||1;const rec=S().simRecurring||[];const exc=new Set(S().simExclude||[]);
  const avg={};rec.forEach(c=>avg[c]=0);let extra=0;
  use.forEach(k=>{const m=state.months[k];
    ['bollette','debiti','spese'].forEach(b=>m[b].forEach(i=>{
      if(!i.checked||i.once)return;
      if(rec.indexOf(i.cat)>=0)avg[i.cat]+=-i.amount;
      else if(b==='spese'&&!exc.has(i.cat))extra+=-i.amount;
    }));});
  Object.keys(avg).forEach(c=>avg[c]/=n);
  const ks=keys();const lastM=state.months[ks[ks.length-1]];
  return {avg,extra:extra/n,n,abb:lastM.abbonamenti.map(a=>({id:a.id,cat:a.cat,amount:-quota(a)}))};
}
function allCats(){
  const c={};keys().forEach(k=>['spese','debiti','bollette'].forEach(b=>state.months[k][b].forEach(i=>{c[i.cat]=(c[i.cat]||0)+1;})));
  return Object.keys(c).sort((a,b)=>c[b]-c[a]);
}
function entrateCats(){
  const c={};keys().forEach(k=>state.months[k].entrate.forEach(i=>{c[i.cat]=(c[i.cat]||0)+1;}));
  ['Stipendio','Aumento','Vinted','Bonifici','Regali','Tredicesima','Vendita moto'].forEach(x=>{c[x]=(c[x]||0)+1;});

}

const SIMKEY='spese-dashboard-sim-v1';

function simInit(fresh){

  if(typeof sv.once==='number'&&isFinite(sv.once))s.once=sv.once;

function barSvg(vals,labels,o){
  o=o||{};const W=Math.max(520,vals.length*54),H=o.h||190,pl=8,pb=24,pt=14;const mx=Math.max(1,...vals.map(Math.abs),o.line||0)*1.08;
  const pos=Math.max(0,...vals)>0,neg=Math.min(0,...vals)<0;
  const top=pos?mx:0,bot=neg?-mx:0;const rng=(top-bot)||1;const y=v=>pt+(top-v)/rng*(H-pt-pb);const bw=Math.min(30,(W-pl*2)/vals.length*.6);
  const g=vals.map((v,i)=>{const cx=pl+(i+.5)*(W-pl*2)/vals.length;const y0=y(0),y1=y(v);const col=o.color||(v>=0?'#5FC9A8':'#E4776E');
    return `<rect x="${cx-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="3" fill="${col}"><title>${esc(labels[i])}: ${eur(v)}</title></rect><text x="${cx}" y="${H-8}" text-anchor="middle">${esc(labels[i])}</text><text x="${cx}" y="${(v>=0?y1-4:y1+11)}" text-anchor="middle" style="fill:var(--ink)">${eur0(v)}</text>`;}).join('');
  const ln=o.line!=null?`<line x1="0" x2="${W}" y1="${y(o.line)}" y2="${y(o.line)}" stroke="#D9A94E" stroke-dasharray="4 3"/><text x="${W-2}" y="${y(o.line)-3}" text-anchor="end" style="fill:#D9A94E">media ${eur0(o.line)}</text>`:'';
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria||'grafico')}"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="#28405F"/>${ln}${g}</svg></div>`;
}

function catSettings(){

  const block=b=>catalog().map((c,ix)=>({c,ix})).filter(x=>x.c.bucket===b).sort((x,y)=>x.c.name.localeCompare(y.c.name,'it')).map(({c,ix})=>`<tr>
    <td style="width:230px"><input class="cell" data-chg="catMain" data-ix="${ix}" value="${esc(c.name)}"><div class="hint" style="padding-left:6px">${cnt[c.name]||0} movimenti</div></td>
    <td style="width:86px"><select class="cell" data-chg="catBucket" data-ix="${ix}"><option value="50" ${c.bucket==='50'?'selected':''}>50%</option><option value="30" ${c.bucket==='30'?'selected':''}>30%</option></select></td>
    <td><textarea class="cell" style="min-height:38px" data-chg="catItems" data-ix="${ix}" placeholder="nessuna">${esc((c.items||[]).join(', '))}</textarea></td>
    <td><textarea class="cell soft" style="min-height:38px" data-chg="catKw" data-ix="${ix}">${esc((c.kw||[]).join(', '))}</textarea></td>
    <td style="width:26px"><button class="iconbtn" data-act="catDel" data-ix="${ix}" title="Elimina">✕</button></td></tr>`).join('');
  const head=t=>`<tr class="grp"><td colspan="5" class="l mono gold" style="font-size:11px;letter-spacing:.08em;padding:8px 6px">${t}</td></tr>`;
  return `<div class="card" style="margin-top:14px"><h3>Categorie di spesa <span class="tot hint">${catalog().length} categorie principali</span></h3>
  ${umk.length?`<div class="card" style="border-color:var(--neg);margin-bottom:12px"><h3 style="color:var(--neg)">Da associare</h3><div class="hint" style="margin-bottom:6px">Queste categorie non appartengono a nessuna categoria principale: sceglila e verranno spostate in tutti i mesi.</div>${umk.map(u=>`<div class="row" style="margin-bottom:4px"><span style="min-width:200px">${esc(u)} <span class="tag">${um[u]}</span></span><select class="cell" style="width:280px;border-color:var(--line)" data-chg="assignCat" data-cat="${esc(u)}">${catOptions('')}</select></div>`).join('')}</div>`:''}
  <table><thead><tr><th class="l">Categoria principale</th><th class="l">Fascia</th><th class="l">Voci incluse (separate da virgola)</th><th class="l">Parole chiave per il suggerimento</th><th></th></tr></thead><tbody>
  ${head('50% · Necessità')}${block('50')}${head('30% · Svago')}${block('30')}</tbody></table>
  <form class="add" data-form="addCat"><input class="grow" name="name" placeholder="Nuova categoria principale" required><select name="bucket" required><option value="">50% o 30%…</option><option value="50">50% necessità</option><option value="30">30% svago</option></select><input class="grow" name="items" placeholder="Voci incluse (facoltative, separate da virgola)"><button class="btn primary sm">Aggiungi categoria</button></form>
  <div class="hint" style="margin-top:8px">Le voci incluse sono i nomi che vengono ricondotti alla categoria principale (anche nei mesi passati). Le parole chiave servono solo a proporre la categoria quando inserisci una spesa. Quando scegli a mano una categoria per una voce nuova, la voce viene aggiunta da sola alle voci incluse.</div></div>`;
}

function render(){
  if(fileSt.status!=='ok'){$('#app').innerHTML=gateHtml();return;}
  ensureUi();ccCache=null;
  const y=window.scrollY;
  if(isMobile()){renderMobile();window.scrollTo(0,y);return;}
  if(ui.tab==='spese'||ui.tab==='altro')ui.tab='mese';
  let body='';
  if(ui.tab==='mese')body=viewMese();else if(ui.tab==='sim')body=simViews();else if(ui.tab==='tes')body=viewTes();else if(ui.tab==='esop')body=viewEsop();else if(ui.tab==='storico')body=viewStorico();else body=viewSet();
  $('#app').innerHTML=`<div class="wrap">${header()}${body}</div>`;
  window.scrollTo(0,y);
}

document.addEventListener('change',e=>{

  const m=state.months[ui.key];const v=el.value;
  const itemOf=()=>findItem(el.dataset.block,el.dataset.id);
  switch(k){
    case 'selMonth':ui.key=v;render();return;
    case 'addPer':{const f=el.closest('form');const ms=f.querySelector('[name=month]');const a=v==='annuale';ms.disabled=!a;ms.required=a;ms.style.display=a?'':'none';f.querySelector('[name=amt]').placeholder=a?'Importo annuo':'Importo';return;}

    case 'perM':mutate(()=>{itemOf().month=v?Number(v):null;});return;

    case 'catBucket':mutate(()=>{catalog()[+el.dataset.ix].bucket=v;});return;
    case 'catItems':mutate(()=>{catalog()[+el.dataset.ix].items=v.split(',').map(x=>x.trim()).filter(Boolean);applyCatalog(state);});return;
    case 'catKw':mutate(()=>{catalog()[+el.dataset.ix].kw=v.split(',').map(x=>x.trim()).filter(Boolean);});return;
    case 'catMain':{const c=catalog()[+el.dataset.ix];const nn=v.trim();const old=c.name;if(!nn||(nn!==old&&catOf(nn))){bad(el);render();return;}
      mutate(()=>{c.name=nn;keys().forEach(k=>{const mm=state.months[k];mm.spese.forEach(i=>{if(i.cat===old)i.cat=nn;});if(mm.budgets&&mm.budgets[old]!=null){mm.budgets[nn]=mm.budgets[old];delete mm.budgets[old];}});
        ['simRecurring','simExclude'].forEach(f=>{S()[f]=(S()[f]||[]).map(x=>x===old?nn:x);});});ui.sim=null;return;}
    case 'assignCat':{if(!v)return;mutate(()=>{catOf(v).items.push(el.dataset.cat);applyCatalog(state);});return;}
    case 'needCats':mutate(()=>{S().needCats=v.split(',').map(x=>x.trim()).filter(Boolean);});return;
    case 'f':{const f=el.dataset.f;mutate(()=>{const i=itemOf();i[f]=(f==='date')?(v||null):v.trim()||i[f];if(f==='cat'&&el.dataset.block==='entrate')i.salary=(i.cat.toLowerCase()==='stipendio');});return;}
    case 'amt':{const b=el.dataset.block;const nat=b==='entrate'?1:-1;const n=parseAmount(v,nat);if(isNaN(n)){bad(el);return;}
      mutate(()=>{const i=itemOf();i.amount=Math.round(n*10000)/10000;if(b!=='entrate'&&b!=='spese'){const tr=String(v).trim().replace(/^[+-]/,'');i.expr=/^[0-9.,]+$/.test(tr)?null:tr.replace(/,/g,'.').replace(/\s+/g,'');}});return;}
    case 'bud':{const n=parseAmount(v,-1);if(isNaN(n)){bad(el);return;}mutate(()=>{itemOf().budget=Math.round(n*10000)/10000;});return;}
    case 'catName':{const nn=v.trim();if(!nn){render();return;}mutate(()=>{m.spese.forEach(i=>{if(i.cat===el.dataset.cat)i.cat=nn;});if(m.budgets&&m.budgets[el.dataset.cat]!=null&&nn!==el.dataset.cat){m.budgets[nn]=m.budgets[el.dataset.cat];delete m.budgets[el.dataset.cat];}});return;}
    case 'catBudget':{m.budgets=m.budgets||{};if(!v.trim()){mutate(()=>{delete m.budgets[el.dataset.cat];});return;}const n=parseAmount(v,-1);if(isNaN(n)){bad(el);return;}mutate(()=>{m.budgets[el.dataset.cat]=n;});return;}
    case 'scnF':{const x=state.scenarios.find(s=>s.id===el.dataset.id);const f=el.dataset.f;if(f==='amount'){const n=evalExpr(v);if(isNaN(n)){bad(el);return;}mutate(()=>{x.amount=n;});}else mutate(()=>{x[f]=v;});return;}
    case 'simOnce':{const n=evalExpr(v);if(isNaN(n)){bad(el);return;}ui.sim.once=Math.abs(n);simSave();render();return;}
    case 'tfrL':{const n=evalExpr(v);if(isNaN(n)){bad(el);return;}mutate(()=>{state.tesoretto.tfrLordo=n;});return;}
    case 'tfrT':{const n=evalExpr(v);if(isNaN(n)){bad(el);return;}mutate(()=>{state.tesoretto.tfrTax=n/100;});return;}
    case 'tesF':{const x=state.tesoretto.items.find(s=>s.id===el.dataset.id);const f=el.dataset.f;if(f==='amount'){const n=evalExpr(v);if(isNaN(n)){bad(el);return;}mutate(()=>{x.amount=n;});}else mutate(()=>{x[f]=v;});return;}
    case 'esopF':{const r=state.esop.rows.find(s=>s.id===el.dataset.id);const n=evalExpr(v);if(isNaN(n)){bad(el);return;}mutate(()=>{r[el.dataset.f]=n;});return;}
    case 'esopSar':{const r=state.esop.rows.find(s=>s.id===el.dataset.id);if(!v.trim()){mutate(()=>{r.sarTax='';});return;}const n=evalExpr(v);if(isNaN(n)){bad(el);return;}mutate(()=>{r.sarTax=n/100;});return;}
    case 'esopP':{const n=evalExpr(v);if(isNaN(n)){bad(el);return;}mutate(()=>{state.esop[el.dataset.f]=n/100;});return;}
    case 'esopNote':mutate(()=>{state.esop.note=v;});return;
    case 'trendCat':ui.trendCat=v;render();return;
    case 'setDay':{const n=parseInt(v,10);if(!(n>=1&&n<=28)){bad(el);return;}mutate(()=>{S().cycleStartDay=n;});return;}
    case 'setRec':mutate(()=>{S().simRecurring=v.split(',').map(x=>x.trim()).filter(Boolean);});ui.sim=null;return;
    case 'setExc':mutate(()=>{S().simExclude=v.split(',').map(x=>x.trim()).filter(Boolean);});ui.sim=null;return;
    case 'setTh':{const n=evalExpr(v);if(isNaN(n)||n<0||n>100){bad(el);return;}mutate(()=>{S().recThreshold=n/100;});return;}
    case 'setWin':mutate(()=>{S().simWindow=v;});ui.sim=null;return;
  }
});

document.addEventListener('submit',e=>{

    mutate(()=>{m.spese.push({id:uid(),date:fd.get('date')||null,cat,desc,amount:Math.round(n*100)/100,checked:true,once:false});if(learn)catOf(cat).items.push(desc);});

    const nf=document.querySelector('form[data-form=addSpesa] [name=desc]');if(nf)nf.focus();}
  else if(kind==='addCat'){const name=String(fd.get('name')).trim();const b=fd.get('bucket');
    if(!name||catOf(name)){bad(f.querySelector('[name=name]'));return;}if(b!=='50'&&b!=='30'){bad(f.querySelector('[name=bucket]'));return;}
    mutate(()=>{S().catalog.push({name,bucket:b,items:String(fd.get('items')||'').split(',').map(x=>x.trim()).filter(Boolean),kw:[]});applyCatalog(state);});}
  else if(kind==='addEntrata'){const n=parseAmount(fd.get('amt'),1);if(isNaN(n)||n===0){bad2();return;}const cat=String(fd.get('cat')).trim();
    mutate(()=>{m.entrate.push({id:uid(),date:fd.get('date')||null,cat,desc:'',amount:Math.round(n*100)/100,checked:cat.toLowerCase()!=='stipendio',salary:cat.toLowerCase()==='stipendio',once:false});});}

  else if(kind==='addTes'){const n=evalExpr(fd.get('amt'));if(isNaN(n)){bad2();return;}mutate(()=>{state.tesoretto.items.push({id:uid(),label:String(fd.get('label')).trim(),amount:n,collected:false,note:''});});}
});

  const ent=mDet('entrate',`<div><div>Entrate</div><div class="m-soft m-sm">Stipendio ${eur0(t.salary)}${Math.abs(t.entrateExtra)>0.004?' · extra '+eur0(t.entrateExtra):''}</div></div><span class="mono m-push">${eur(t.entrateTot)}</span>`,
    `<div class="m-sub"><div class="m-row m-subh"><span class="m-lb">Entrate del ciclo</span><button class="m-link" data-act="mAddEnt">+ Aggiungi</button></div>${m.entrate.map(i=>mItem('entrate',i,`${chkBtn(i.checked&&!i.salary?'all':'none',`data-act="toggle" data-block="entrate" data-id="${i.id}"`,i.salary)}<span class="m-it-t">${esc(i.cat)}${i.salary?' <span class="tag">stipendio</span>':''}${i.once?' <span class="tag">1×</span>':''}</span><span class="mono ${cls(i.amount)}">${eur(i.amount)}</span>`)).join('')||'<div class="m-soft m-sm">Nessuna entrata</div>'}</div>`);

function mSpese(){
  const m=state.months[ui.key];const t=totals(m);
  const groups={},order=[];m.spese.forEach(i=>{if(!groups[i.cat]){groups[i.cat]=[];order.push(i.cat);}groups[i.cat].push(i);});
  const cats=order.slice();if(ui.sortSpese==='importo')cats.sort((a,b)=>sum(groups[a])-sum(groups[b]));
  const mx=Math.max(1,...cats.map(c=>-sum(groups[c])));
  const rows=cats.map(c=>{
    const L=groups[c];const tot=sum(L);const bud=m.budgets&&m.budgets[c]!=null?m.budgets[c]:null;const open=!!ui.expanded[ui.key+'|'+c];const ek=esc(c);
    const w=bud!=null&&bud<0?pctW(-tot,-bud):pctW(-tot,mx);
    const over=bud!=null&&tot-bud<-0.004;
    let h=`<div class="m-cat"><div class="m-row m-cath" data-act="expand" data-cat="${ek}"><span class="m-it-t"><span class="m-chev ${open?'open':''}">›</span> ${ek} <span class="m-soft m-sm">${L.length}</span>${catOf(c)?'':' <span class="tag" style="border-color:var(--neg);color:var(--neg)">da associare</span>'}</span><span class="mono ${cls(tot)}">${eur(tot)}</span></div>
      <div class="bar"><i style="width:${w}%;background:${bud!=null?(over?'var(--neg)':'var(--pos)'):'var(--gold)'}"></i></div>
      ${bud!=null?`<div class="m-soft m-sm" style="margin-top:3px">budget ${eur0(-bud)} · ${over?'<span class="neg">sforato di '+eur0(bud-tot)+'</span>':'rimasti '+eur0(tot-bud)}</div>`:''}`;
    if(open)h+=`<div class="m-items">${L.map(i=>mItem('spese',i,`${chkBtn(i.checked?'all':'none',`data-act="toggle" data-block="spese" data-id="${i.id}"`)}<span class="m-it-d">${fmtShort(i.date)}</span><span class="m-it-t">${esc(i.desc||i.cat)}${i.once?' <span class="tag">1×</span>':''}</span><span class="mono ${cls(i.amount)}">${eur(i.amount)}</span>`)).join('')}

    return h+'</div>';}).join('');
  return `<div class="m-row m-hrow"><h2 class="m-h2">Spese del mese</h2><span class="mono">${eur(t.spe)}</span></div>
    <div class="m-row m-hrow"><span class="m-soft m-sm">Tocca una spesa per modificarla</span><button class="m-link" data-act="sortSpese">Ordina: ${ui.sortSpese==='ordine'?'inserimento':'importo'}</button></div>
    <div class="m-card m-list">${rows||'<div class="empty">Nessuna spesa registrata</div>'}</div>`;
}

  <div class="row"><label class="f">Ciclo (mese di fine)<input type="month" name="key" value="${nk}" required></label>
  <label class="f">Stipendio ricevuto (€)<input name="sal" value="${numStr(sal)}" class="mono" style="width:130px;text-align:right" required></label>
</div>
  <div class="hint" style="margin-top:6px">Il C/C a inizio ciclo è calcolato in automatico: saldo a fine ciclo precedente (${eur(pt.attuale)}) + stipendio.</div>
  <div class="hint" style="margin:12px 0 0">Righe fisse da riportare dal ciclo precedente (budget → importo, senza spunta):</div><div class="carry">${carry||'<span class="hint">Nessuna riga</span>'}</div>
  <div class="actions"><button type="button" class="btn" id="nm-cancel">Annulla</button><button class="btn primary" value="ok">Crea ciclo</button></div></form>`;
  d.showModal();
  $('#nm-cancel').onclick=()=>d.close();
  $('#nm-form').onsubmit=ev=>{
    ev.preventDefault();const fd=new FormData(ev.target);const key=fd.get('key');
    if(state.months[key]){alert('Esiste già il ciclo '+label(key));return;}
    const s=evalExpr(fd.get('sal')),cc=pt.attuale+s;if(isNaN(s)){alert('Importi non validi');return;}
    const ci=cycleInfo(key);
    const m={ccStart:cc,entrate:[{id:uid(),date:toISO(ci.start),cat:'Stipendio',desc:'',amount:s,checked:false,salary:true,once:false}],bollette:[],abbonamenti:[],debiti:[],spese:[],budgets:{}};
    fd.getAll('carry').forEach(v=>{const [b,id]=v.split('|');const it=pm[b].find(x=>x.id===id);if(it)m[b].push({id:uid(),cat:it.cat,budget:it.budget,amount:it.budget,expr:it.expr||null,checked:false,once:false,period:it.period||'mensile',month:it.month||null});});
    state.months[key]=m;ui.key=key;ui.tab='mese';d.close();commit();
  };
}
/* ---------- import / export ---------- */
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);}
$('#file-import').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.months||!o.settings)throw new Error('formato');
    if(!confirm('Sostituire i dati attuali con il backup "'+f.name+'"? ('+Object.keys(o.months).length+' cicli)'))return;
    state=migrate(o);state.updatedAt=new Date().toISOString();ui.key=null;ui.sim=null;ensureUi();save();render();toast('Backup importato');
  }catch(err){alert('File non valido: '+err.message);}e.target.value='';};
  r.readAsText(f);
});
/* ---------- dati su Dropbox (cartella dell'app) ---------- */
const DBX_KEY='6ltb0ryesnuc5yk';
const DBX_REDIRECT='https://gabrieleghironi.github.io/spese/';
const DATA_NAME='spese-dati.json',DATA_PATH='/'+DATA_NAME;
const TOK_KEY='spese-dbx-refresh';
const fileSt={status:'checking',last:null,err:'',rev:null,loaded:false,pending:0,token:null,tokenExp:0};
function fileStatusHtml(){return fileSt.last?'Salvato su Dropbox alle '+fileSt.last.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'Dati letti da Dropbox';}
function updFileBar(){const el=$('#file-status');if(el)el.innerHTML=fileStatusHtml();}
function gateHtml(){
  let body,btn='';
  switch(fileSt.status){
    case 'checking':body='Apertura dei dati in corso…';break;
    case 'none':body='Accedi con il tuo account Dropbox per aprire i dati. L\'accesso resta attivo su questo dispositivo.';btn='<button class="btn primary" data-act="dbxLogin">Accedi con Dropbox</button>';break;
    case 'conflict':body=DATA_NAME+' è stato modificato da un altro dispositivo o da un\'altra scheda. Per non sovrascriverlo, la dashboard si è fermata: ricarica i dati. L\'ultima modifica fatta qui non è stata salvata.';btn='<button class="btn primary" data-act="fileReload">Ricarica i dati</button>';break;
    case 'missing':body=DATA_NAME+' non è nella cartella della dashboard su Dropbox. Spostalo nella cartella <b>Applicazioni</b> → cartella di questa app, poi premi Riprova.';btn='<button class="btn primary" data-act="fileReload">Riprova</button><button class="btn" data-act="dbxLogout">Esci da Dropbox</button>';break;
    default:body='<span class="neg">Errore sui dati: '+esc(fileSt.err)+'</span>';btn='<button class="btn primary" data-act="fileReload">Riprova</button><button class="btn" data-act="dbxLogout">Esci da Dropbox</button>';
  }
  return `<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px"><div class="card" style="max-width:540px;padding:28px"><div class="brand" style="margin-bottom:14px"><small>Monitoraggio spese</small>Spese Gabriele</div><p style="margin:0 0 18px">${body}</p><div class="row">${btn}</div></div></div>`;
}
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){}}
async function dbxLoginStart(){
  const rnd=new Uint8Array(48);crypto.getRandomValues(rnd);const ver=b64url(rnd);
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  const st=b64url(crypto.getRandomValues(new Uint8Array(12)));
  try{sessionStorage.setItem('spese-dbx-pkce',JSON.stringify({ver,st}));}catch(e){}
  const q=new URLSearchParams({client_id:DBX_KEY,response_type:'code',code_challenge:ch,code_challenge_method:'S256',redirect_uri:DBX_REDIRECT,token_access_type:'offline',scope:'files.content.read files.content.write',state:st});
  location.href='https://www.dropbox.com/oauth2/authorize?'+q.toString();
}
async function tokenReq(params){
  const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(Object.assign({client_id:DBX_KEY},params))});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error_description||j.error||('accesso Dropbox non riuscito ('+r.status+')')),{auth:true});
  fileSt.token=j.access_token;fileSt.tokenExp=Date.now()+((j.expires_in||14400)-120)*1000;
  if(j.refresh_token)lsSet(TOK_KEY,j.refresh_token);
}
async function getToken(force){
  if(!force&&fileSt.token&&Date.now()<fileSt.tokenExp)return fileSt.token;
  const rt=lsGet(TOK_KEY);if(!rt)throw Object.assign(new Error('accesso Dropbox scaduto'),{auth:true});
  await tokenReq({grant_type:'refresh_token',refresh_token:rt});return fileSt.token;
}
async function dbx(url,arg,body){
  for(let i=0;i<2;i++){
    const tk=await getToken(i>0);
    const hd={'Authorization':'Bearer '+tk,'Dropbox-API-Arg':JSON.stringify(arg)};if(body!=null)hd['Content-Type']='application/octet-stream';
    let r;try{r=await fetch(url,{method:'POST',headers:hd,body:body==null?undefined:body});}catch(e){throw new Error('connessione a Dropbox non riuscita');}
    if(r.status===401&&i===0)continue;
    if(r.status===401)throw Object.assign(new Error('accesso Dropbox non valido'),{auth:true});
    return r;
  }
}
async function readData(){
  const r=await dbx('https://content.dropboxapi.com/2/files/download',{path:DATA_PATH});
  if(r.status===409){const j=await r.json().catch(()=>({}));if(/not_found/.test(JSON.stringify(j)))throw Object.assign(new Error('non trovato'),{missing:true});throw new Error('Dropbox: '+(j.error_summary||409));}
  if(!r.ok)throw new Error('lettura da Dropbox non riuscita ('+r.status+')');
  const meta=JSON.parse(r.headers.get('Dropbox-API-Result')||'{}');
  return {txt:await r.text(),rev:meta.rev||null};
}
let writing=Promise.resolve();
function writeFile(){
  fileSt.pending++;
  writing=writing.then(async()=>{
    if(fileSt.status!=='ok')return;
    try{
      const arg={path:DATA_PATH,mode:fileSt.rev?{'.tag':'update',update:fileSt.rev}:{'.tag':'add'},autorename:false,mute:true};
      const r=await dbx('https://content.dropboxapi.com/2/files/upload',arg,new Blob([JSON.stringify(state,null,1)],{type:'application/octet-stream'}));
      if(r.status===409){const j=await r.json().catch(()=>({}));if(/conflict/.test(JSON.stringify(j))){fileSt.status='conflict';render();return;}throw new Error('Dropbox: '+(j.error_summary||409));}
      if(!r.ok)throw new Error('salvataggio su Dropbox non riuscito ('+r.status+')');
      const j=await r.json();fileSt.rev=j.rev;fileSt.last=new Date();updFileBar();
    }catch(e){fileFail(e);}
  }).finally(()=>{fileSt.pending--;});
  return writing;
}
function scheduleFileWrite(){if(fileSt.status==='ok')writeFile();}
window.addEventListener('beforeunload',e=>{if(fileSt.pending>0){e.preventDefault();e.returnValue='';}});
async function loadData(){
  fileSt.status='checking';render();
  const d=await readData();
  if(!d.txt.trim())throw new Error(DATA_NAME+' è vuoto');
  const o=JSON.parse(d.txt);if(!o||!o.months||!o.settings)throw new Error(DATA_NAME+' non valido');
  state=migrate(o);ccCache=null;ui.sim=null;ui.key=null;ensureUi();
  fileSt.rev=d.rev;fileSt.loaded=true;fileSt.last=null;fileSt.status='ok';render();
}
function fileFail(e){
  if(e&&e.auth){lsSet(TOK_KEY,null);fileSt.token=null;fileSt.status='none';}
  else if(e&&e.missing)fileSt.status='missing';
  else{fileSt.status='error';fileSt.err=(e&&e.message)||String(e);}
  render();
}
async function initFile(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('code')||q.get('error')){
      let pk=null;try{pk=JSON.parse(sessionStorage.getItem('spese-dbx-pkce')||'null');sessionStorage.removeItem('spese-dbx-pkce');}catch(e){}
      history.replaceState(null,'',location.pathname);
      if(q.get('error')){fileSt.status='none';render();return;}
      if(!pk||pk.st!==q.get('state'))throw new Error('accesso non valido, riprova');
      await tokenReq({grant_type:'authorization_code',code:q.get('code'),code_verifier:pk.ver,redirect_uri:DBX_REDIRECT});
    }
    if(!lsGet(TOK_KEY)){fileSt.status='none';render();return;}
    await loadData();
  }catch(e){fileFail(e);}
}
/* ---------- aggiornamento automatico della pagina ---------- */
const nl=x=>String(x).replace(/\r\n?/g,'\n');
const OWN_CODE=(()=>{const st=document.querySelector('style'),sc=document.currentScript;return nl((st?st.textContent:'')+'\u0000'+(sc?sc.textContent:''));})();
if(new URLSearchParams(location.search).has('v'))history.replaceState(null,'',location.pathname);
let updBusy=false;
async function checkUpdate(manual){
  if(updBusy)return false;
  if(!manual&&(document.querySelector('dialog[open]')||(document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))))return false;
  updBusy=true;
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return false;
    const d=new DOMParser().parseFromString(await r.text(),'text/html');
    const st=d.querySelector('style'),scs=d.querySelectorAll('script'),sc=scs[scs.length-1];if(!sc)return false;
    if(nl((st?st.textContent:'')+'\u0000'+sc.textContent)===OWN_CODE)return false;
    let last=0;try{last=+sessionStorage.getItem('spese-upd')||0;}catch(e){}
    if(Date.now()-last<60000)return false;
    try{sessionStorage.setItem('spese-upd',String(Date.now()));}catch(e){}
    await writing.catch(()=>{});
    location.replace(location.pathname+'?v='+Date.now());
    return true;
  }catch(e){return false;}finally{updBusy=false;}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
async function pullRefresh(){
  await writing.catch(()=>{});
  if(fileSt.status==='none'||fileSt.status==='checking')return 'skip';
  if(fileSt.status!=='ok'||!fileSt.loaded){await loadData();return 'new';}
  const d=await readData();
  if(d.rev&&d.rev===fileSt.rev)return 'same';
  if(!d.txt.trim())throw new Error(DATA_NAME+' è vuoto');
  const o=JSON.parse(d.txt);if(!o||!o.months||!o.settings)throw new Error(DATA_NAME+' non valido');
  state=migrate(o);ccCache=null;ui.sim=null;ensureUi();
  fileSt.rev=d.rev;fileSt.last=null;render();
  return 'new';
}
(function(){
  const TH=70,MAX=110;
  const el=document.createElement('div');el.id='ptr';document.body.appendChild(el);
  let y0=null,x0=0,dy=0,active=false,busy=false;
  const show=(y,txt,go)=>{el.textContent=txt;el.classList.toggle('go',!!go);el.style.opacity=y>8?'1':'0';el.style.transform='translate(-50%,'+(y-50)+'px)';};
  const hide=()=>{el.classList.add('anim');show(0,el.textContent,false);};
  const top=()=>Math.max(window.scrollY||0,(document.scrollingElement||document.documentElement).scrollTop||0);
  const blocked=t=>{
    if(document.querySelector('dialog[open]')||t.closest('input,select,textarea,details.menu[open],#toast,.m-nav'))return true;
    for(let n=t;n&&n!==document.body;n=n.parentElement){if(n.scrollTop>0)return true;}
    return false;
  };
  window.addEventListener('touchstart',e=>{
    if(busy||e.touches.length!==1||top()>1||blocked(e.target)){y0=null;return;}
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;dy=0;active=false;
  },{passive:true});
  window.addEventListener('touchmove',e=>{
    if(y0==null)return;
    const t=e.touches[0],ddy=t.clientY-y0,ddx=t.clientX-x0;
    if(!active){
      if(ddy<=0||Math.abs(ddx)>Math.abs(ddy)){if(Math.abs(ddx)>8||ddy<-3)y0=null;return;}
      if(top()>1){y0=null;return;}
      active=true;el.classList.remove('anim');
    }
    if(e.cancelable)e.preventDefault();
    dy=Math.min(MAX,Math.max(ddy*.5,-(window.scrollY||0)));
    show(dy,dy>=TH*.8?'Rilascia per aggiornare':'Trascina per aggiornare',dy>=TH*.8);
  },{passive:false});
  const end=async()=>{
    if(y0==null||!active){y0=null;return;}
    y0=null;active=false;
    if(dy<TH*.8){hide();return;}
    busy=true;el.classList.add('anim');show(60,'Aggiornamento…',true);
    let msg='Dati aggiornati';
    if(await checkUpdate(true)){show(60,'Nuova versione: ricarico…',true);return;}
    try{const r=await pullRefresh();if(r==='same')msg='Già aggiornati';else if(r==='skip')msg='Accedi a Dropbox per aggiornare';}
    catch(err){fileFail(err);msg='Aggiornamento non riuscito';}
    show(60,msg,false);
    setTimeout(()=>{hide();busy=false;},900);
  };
  window.addEventListener('touchend',end,{passive:true});
  window.addEventListener('touchcancel',()=>{y0=null;if(active){active=false;hide();}});
})();
window.__app={get state(){return state;},totals,projection,cycleInfo,simBase,tesoretto,esopTotNet,keys,ui,render,parseAmount,evalExpr};
render();initFile();setTimeout(checkUpdate,1500);
})();
